# Set de artistas del estudio.
# genius_id y conteos verificados via API de Genius el 28/8/2026
# (canciones = listadas como artista principal; con_letra = lyrics_state == "complete").
# mbid (MusicBrainz) se completa en la Fase 1.

sujeto:
  ruben_rada:
    nombre: "Rubén Rada"
    genius_id: 390523
    genius_canciones: 139
    genius_con_letra: 95
    mbid: "5b032b22-6131-44c8-bccc-aae7006eec3a"  # verificado; en MB faltan Adar Nebur (1984) y Gamurgatrónica (2025)
    discogs_id: 329162
    actividad: [1965, 2025]
    # Época 1 (El Kinto / Tótem) vive bajo fichas de banda, no bajo la solista.
    # Regla METODO.md: si tras la Fase 3 la época 1 queda con <10 canciones con
    # letra y autoría propia, se fusiona con la solista temprana.
    fichas_adicionales:
      el_kinto: { genius_id: 1669718, mbid: "3288c6e1-f68d-4df6-b198-08a3f2195dc7" }   # mbid: completar en Fase 1
      totem: { genius_id: 2278325, mbid: "f35c7c24-7a2e-453b-969b-d73d1d4b88f0" }      # "Totem Uruguay" en Genius; mbid: completar en Fase 1
      opa: { genius_id: null, mbid: "295f672b-8eab-47a2-82d3-d2836079299f" }           # no existe en Genius; subcorpus excluido (inglés/instrumental)
    epocas:
      - { nombre: "El Kinto / Tótem", desde: 1967, hasta: 1973 }
      - { nombre: "Solista 70s-80s", desde: 1974, hasta: 1992 }
      - { nombre: "Retorno", desde: 1993, hasta: 2002 }
      - { nombre: "Tardía", desde: 2006, hasta: 2025 }

